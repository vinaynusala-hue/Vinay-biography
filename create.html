<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Vinay | Create & Build</title>

<link rel="stylesheet" href="style.css">

<style>

/* ==================================================
   CREATE PAGE - COMPLETE INDEPENDENT DESIGN
================================================== */

html,
body {

    margin: 0 !important;
    padding: 0 !important;

    width: 100%;

    background: #000 !important;

    color: white !important;

    overflow-x: hidden !important;
}


/* IMPORTANT:
   Prevent style.css from making sections
   full-screen or hiding content.
*/

.create-page,
.create-page section {

    height: auto !important;

    min-height: 0 !important;

    max-height: none !important;
}


/* ==================================================
   PAGE
================================================== */

.create-page {

    width: 100%;

    max-width: 1100px;

    margin: 0 auto !important;

    padding:
        55px 20px 60px !important;

    box-sizing: border-box;

    background: #000 !important;
}


/* ==================================================
   HERO
================================================== */

.create-hero {

    display: block !important;

    text-align: center;

    padding:
        25px 0 70px !important;

    margin: 0 0 30px !important;

    animation:
        heroIn 1s ease forwards;
}


@keyframes heroIn {

    from {

        opacity: 0;

        transform:
            translateY(35px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


.create-main-icon {

    width: 110px;

    height: 110px;

    margin: 0 auto 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    font-size: 55px;

    background:
        radial-gradient(
            circle,
            rgba(0,217,255,0.14),
            rgba(255,255,255,0.03)
        );

    border:
        1px solid
        rgba(0,217,255,0.4);

    box-shadow:

        0 0 25px
        rgba(0,217,255,0.25),

        0 0 70px
        rgba(0,217,255,0.08);

    animation:
        rocketFloat 3s ease-in-out infinite;
}


@keyframes rocketFloat {

    0%,
    100% {

        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {

        transform:
            translateY(-12px)
            rotate(5deg);
    }
}


.create-hero h1 {

    margin:
        0 0 20px !important;

    padding: 0 !important;

    color:
        white !important;

    font-size:
        clamp(38px, 7vw, 58px) !important;

    line-height:
        1.15 !important;
}


.create-hero h1 span {

    color:
        #00d9ff !important;

    text-shadow:
        0 0 25px
        rgba(0,217,255,0.4);
}


.create-hero p {

    max-width:
        750px;

    margin:
        0 auto !important;

    color:
        #aeb8c8 !important;

    font-size:
        17px;

    line-height:
        1.8;
}


/* ==================================================
   COMMON SECTION
================================================== */

.create-section {

    display: block !important;

    width: 100%;

    height: auto !important;

    min-height: 0 !important;

    margin:
        0 0 90px !important;

    padding: 0 !important;

    box-sizing: border-box;
}


/* ==================================================
   TITLES
================================================== */

.create-title {

    text-align:
        center;

    margin:
        0 0 40px !important;
}


.create-title h2 {

    margin:
        0 0 12px !important;

    color:
        white !important;

    font-size:
        32px !important;
}


.create-title h2 span {

    color:
        #00d9ff !important;
}


.create-title p {

    margin: 0 !important;

    color:
        #8f9aaa !important;

    line-height:
        1.7;
}


/* ==================================================
   HOW TO CREATE WEBSITE
================================================== */

.website-steps {

    display:
        grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap:
        20px;
}


.website-step {

    position:
        relative;

    padding:
        28px 22px;

    min-height:
        230px;

    box-sizing:
        border-box;

    border-radius:
        22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.08),
            rgba(255,255,255,0.025)
        ) !important;

    border:
        1px solid
        rgba(255,255,255,0.12);

    transition:
        0.4s ease;

    overflow:
        hidden;

    animation:
        cardUp 0.8s ease both;
}


.website-step:nth-child(1) {
    animation-delay: .1s;
}

.website-step:nth-child(2) {
    animation-delay: .25s;
}

.website-step:nth-child(3) {
    animation-delay: .4s;
}

.website-step:nth-child(4) {
    animation-delay: .55s;
}


@keyframes cardUp {

    from {

        opacity: 0;

        transform:
            translateY(35px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


.website-step:hover {

    transform:
        translateY(-10px);

    border-color:
        rgba(0,217,255,0.5);

    box-shadow:
        0 20px 45px
        rgba(0,217,255,0.08);
}


.step-number {

    display:
        inline-flex;

    width:
        45px;

    height:
        45px;

    align-items:
        center;

    justify-content:
        center;

    margin-bottom:
        20px;

    border-radius:
        50%;

    color:
        #00d9ff;

    border:
        2px solid
        #00d9ff;

    box-shadow:
        0 0 18px
        rgba(0,217,255,0.2);
}


.website-step h3 {

    margin:
        0 0 12px;

    color:
        white !important;

    font-size:
        21px;
}


.website-step p {

    margin: 0;

    color:
        #aeb8c8 !important;

    line-height:
        1.65;
}


/* ==================================================
   TECHNOLOGY FLOW
================================================== */

.tech-flow {

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        15px;

    flex-wrap:
        wrap;

    padding:
        35px 20px;

    border-radius:
        25px;

    background:
        rgba(255,255,255,0.035);

    border:
        1px solid
        rgba(255,255,255,0.1);
}


.tech-box {

    min-width:
        130px;

    padding:
        22px 15px;

    text-align:
        center;

    border-radius:
        18px;

    background:
        rgba(255,255,255,0.06);

    border:
        1px solid
        rgba(255,255,255,0.1);

    transition:
        .35s ease;
}


.tech-box:hover {

    transform:
        translateY(-8px)
        scale(1.04);

    border-color:
        #00d9ff;

    box-shadow:
        0 0 25px
        rgba(0,217,255,0.15);
}


.tech-box .tech-icon {

    display:
        block;

    font-size:
        38px;

    margin-bottom:
        10px;
}


.tech-box strong {

    color:
        white;
}


.tech-arrow {

    color:
        #00d9ff;

    font-size:
        28px;

    animation:
        arrowPulse 1.5s ease-in-out infinite;
}


@keyframes arrowPulse {

    0%,
    100% {

        transform:
            translateX(0);
    }

    50% {

        transform:
            translateX(6px);
    }
}


/* ==================================================
   WAYS TO DEVELOP
================================================== */

.development-grid {

    display:
        grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap:
        22px;
}


.development-card {

    padding:
        28px;

    border-radius:
        22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.07),
            rgba(255,255,255,0.02)
        );

    border:
        1px solid
        rgba(255,255,255,0.1);

    transition:
        .4s ease;
}


.development-card:hover {

    transform:
        translateY(-8px);

    border-color:
        rgba(0,217,255,0.4);

    box-shadow:
        0 20px 45px
        rgba(0,0,0,.5);
}


.development-card h3 {

    margin:
        0 0 12px;

    color:
        white;
}


.development-card h3 span {

    color:
        #00d9ff;
}


.development-card p {

    margin: 0;

    color:
        #aeb8c8;

    line-height:
        1.7;
}


/* ==================================================
   MOBILE DEVELOPMENT
================================================== */

.mobile-create-box {

    position:
        relative;

    padding:
        40px 30px;

    border-radius:
        25px;

    background:
        linear-gradient(
            135deg,
            rgba(0,217,255,.10),
            rgba(123,44,255,.08),
            rgba(255,255,255,.02)
        );

    border:
        1px solid
        rgba(0,217,255,.2);

    overflow:
        hidden;
}


.mobile-create-box::before {

    content: "";

    position:
        absolute;

    width:
        180px;

    height:
        180px;

    right:
        -80px;

    top:
        -80px;

    border-radius:
        50%;

    background:
        #00d9ff;

    filter:
        blur(80px);

    opacity:
        .12;

    animation:
        glowMove 4s ease-in-out infinite alternate;
}


@keyframes glowMove {

    from {

        transform:
            translate(0,0);
    }

    to {

        transform:
            translate(-50px,50px);
    }
}


.mobile-create-box h3 {

    position:
        relative;

    margin:
        0 0 15px;

    color:
        #00d9ff;
}


.mobile-create-box p {

    position:
        relative;

    margin:
        0;

    color:
        #aeb8c8;

    line-height:
        1.8;
}

   PUBLISHING
================================================== */

.publish-line {

    display:
        grid;

    grid-template-columns:
        repeat(3, 1fr);
